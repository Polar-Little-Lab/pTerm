name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a new version after signing and notarization'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Apple signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check release contract and source
        shell: bash
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true ]]; then node scripts/check-release.mjs --publish; else node scripts/check-release.mjs; fi
      - run: rustup toolchain install 1.90.0 --profile minimal --target aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: macos-release-arm64-1.90-${{ hashFiles('app/src-tauri/Cargo.lock') }}
      - run: npm ci --prefix app
      - run: npm test --prefix app
      - run: cargo +1.90.0 test --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Build, sign and notarize Apple Silicon app
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/pterm-notary-key.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          ./scripts/app-build-signed --target aarch64-apple-darwin
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app/package.json').version")
          test "$VERSION" = "$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          APP=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/pTerm.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          lipo "$APP/Contents/MacOS/pterm" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE=$(codesign --display --verbose=4 "$APP" 2>&1)
          printf '%s\n' "$SIGNATURE" | grep -F 'Authority=Developer ID Application:'
          printf '%s\n' "$SIGNATURE" | grep -F '(runtime)'
          printf '%s\n' "$SIGNATURE" | grep -F 'Timestamp='
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/pTerm-$VERSION-macos-arm64.zip"
          unzip -t "release-assets/pTerm-$VERSION-macos-arm64.zip"
          cd release-assets
          shasum -a 256 "pTerm-$VERSION-macos-arm64.zip" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pTerm-macos-arm64
          path: release-assets/*
          if-no-files-found: error
      - name: Publish verified assets
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app/package.json').version")
          gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "pTerm $VERSION" --notes-file "docs/release-$VERSION-public.md" --draft
          gh release edit "v$VERSION" --draft=false --latest
